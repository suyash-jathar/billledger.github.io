<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!-- <base href="/"> -->

  <!-- To host on Git hub -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bill_ledger_web_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>bill_ledger_web_app</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Preloader for initial load -->
  <div id="preloader"
    style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background-color: #f3e5f5; z-index: 9999;">
    <div style="text-align: center;">
      <div
        style="width: 50px; height: 50px; border: 5px solid #e0e0e0; border-top-color: #673ab7; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;">
      </div>
      <div style="font-family: sans-serif; color: #673ab7; font-weight: bold; font-size: 1.2rem;">Loading Bill Ledger...
      </div>
    </div>
  </div>
  <style>
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
